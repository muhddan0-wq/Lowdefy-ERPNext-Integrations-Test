  container: comp_demo-bench-1
  public_url: http://localhost:8000
  datasource_url: http://host.docker.internal:8000
appsmith:
  url: http://localhost:8081

# Generic install (setup/install-mes.ps1). Role -> Workstation Type that role works on.
