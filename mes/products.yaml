work_instructions:
  Injection Moulding: [Verify the approved recipe (barrel and mould temperature) on the HMI before the first shot., Load dried resin; check moisture is below 0.2 percent for PA6-GF., Run 3 purge shots and inspect the first-off part against the master sample., Record the first-off check and any recipe deviation on the job card.]
  Grip Overmoulding: [Insert the housing halves into the overmould tool with locators engaged., Confirm TPE barrel temperature is in range., Check grip adhesion with the peel test on the first part of each shift.]
  Armature Winding: [Load the armature stack and commutator; confirm turns per coil from the recipe., Set wire tension; run one coil and check turns count., Fuse leads to the commutator hooks and check resistance balance between bars.]
  Stator Winding: [Fit slot insulation paper into every slot., Wind both field coils to recipe turns and terminate leads., Check coil resistance and record out-of-range readings.]
  Varnish Impregnation: [Pre-heat the oven to recipe temperature., Dip windings for the specified time and drain., Cure for the recipe time; log oven temperature at load and unload.]
  Harness Assembly: [Crimp the cable to the switch terminals and pull-test one sample per batch., Fit the strain relief sleeve., Continuity-test every harness.]
  Gearbox Assembly: [Press the bearing into the gear case., Fit the helical gear set and apply 30 g of grease., Spin by hand to check for binding.]
  Hammer Mechanism Assembly: [Assemble the piston, striker and O-rings with grease., Fit the crank gear and the SDS-plus tool holder., Check impact action on the test anvil.]
  Guard & Base Assembly: [Mount the upper guard and lower guard spring., Check that the lower guard retracts and returns fully., Fit the spindle and bearing; check runout is below 0.05 mm.]
  Motor Assembly: [Fit the armature with bearings and fan into the stator., Install carbon brushes and check spring pressure., Spin-test for noise before the run test.]
  Motor Run Test: [Run the motor at no load for 30 seconds., Record no-load current and speed in the quality inspection., Reject and tag any motor outside limits.]
  Final Assembly: [Install the motor, gearbox or mechanism and harness into the housing., Route wires and close the housing halves; torque screws to 1.2 Nm., Fit the chuck, side handle or blade as per the BOM.]
  Hi-Pot & Function Test: [Apply test voltage per recipe; leakage must be at or below 3.5 mA., Measure insulation resistance and no-load speed., Record results in the quality inspection; red-tag failures to the NC rack.]
  Packing: [Apply the rating label and serial label., Pack the tool with the manual and accessories in the carton or case., Scan the carton and complete the job card quantity.]
